spring:
  profiles:
    active: test
  datasource:
      driver-class-name: org.h2.Driver
      url: jdbc:h2:mem:sokey
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

springdoc:
  base-url: http://localhost:8080
  api-docs:
    enabled: true

app:
  cors: "http://localhost:3000,https://localhost:3000,http://localhost:8080,https://localhost:8080"
  email: "test@email.com"
  feedback-form-link: https://forms.gle/k9HNS1kkV3RfRCKX6
  schedules:
    cron:
      group-buy-notification: "0 0 12 * * ?"

aws:
  access-key: testAccessKey
  secret-key: testSecretKey
  region: ap-northeast-2